curobo:
  ros__parameters:
    joint_names: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
    # Joint targets [rad], 6 values per target, visited in order and repeated.
    targets: [0.9828, -0.7098, -0.2267, -0.5089, 1.4612, 0.9725,
              -0.5023, -0.7437, -0.1888, -0.4784, 1.6804, -0.4592]

    output_topic: /dynamic_trajectory_controller/joint_trajectory
    joint_state_topic: /joint_states
    depth_topic: /image_nvblox/depth
    camera_info_topic: /image_nvblox/depth/camera_info
    base_frame: world_manipulator

    rate_hz: 20.0
    interpolation_steps: 4
    warm_iters: 100
    cold_iters: 150
    collision_activation_distance: 0.06
    floor_activation_distance: 0.02
    segment_distance: 0.04
    diverge_rad: 1.0
    path_lookahead_rad: 0.1
    path_max_lead_rad: 0.4
    resync_rad: 0.2

    # Map box in world_manipulator [m]
    map_center: [-0.03, 0.075, 0.43]
    map_size: [1.3, 1.3, 0.8]
    esdf_voxel_size: 0.01
    tsdf_voxel_size: 0.005
    truncation_distance: 0.08
    depth_min: 0.1
    depth_max: 2.0
    decay: 0.7
    floor_z: 0.0
    floor_band: 0.015
    # Robot pedestal left out of the map [x0, y0, z0, x1, y1, z1] in world_manipulator
    base_exclude: [-0.116, 0.145, 0.0, 0.056, 0.36, 0.135]
    warmup_frames: 15
    depth_scale_16u: 0.001

    speed_scale: 1.0
    jerk: 500.0
    stop_decel: 0.8
    step_s: 0.005
    cycles: 2
    lead_s: 0.05
    late_margin_s: 0.01

    arrive_tolerance: 0.002
    hold_at_goal_s: 1.0
    leg_timeout_s: 25.0
    marker_period_s: 0.5
