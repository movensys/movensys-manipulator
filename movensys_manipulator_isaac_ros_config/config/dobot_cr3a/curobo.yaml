curobo:
  ros__parameters:
    joint_names: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
    base_frame: world_manipulator

    # Topics
    action_name: /curobo/move_eef
    output_topic: /dynamic_trajectory_controller/joint_trajectory
    joint_state_topic: /joint_states
    depth_topic: /image_nvblox/depth
    camera_info_topic: /image_nvblox/camera_info
    obstacles_topic: /curobo/obstacles
    goal_joint_state_topic: /curobo/goal_joint_states
    goal_status_topic: /curobo/goal_status
    planned_path_topic: /curobo/planned_path
    interactive_marker_namespace: curobo_goal

    # MPC
    rate_hz: 20.0
    interpolation_steps: 4
    warm_iters: 100
    cold_iters: 150
    collision_activation_distance: 0.06
    floor_activation_distance: 0.02
    diverge_rad: 1.0
    path_lookahead_rad: 0.1
    path_max_lead_rad: 0.4
    resync_rad: 0.2

    # Command shaping
    speed_scale: 1.0
    jerk: 500.0
    stop_decel: 0.8
    step_s: 0.005
    cycles: 2
    lead_s: 0.05
    late_margin_s: 0.01
    arrive_tolerance: 0.002

    # Planning and replanning
    ik_num_seeds: 32
    plan_collision_activation_distance: 0.06
    plan_interpolation_dt: 0.02
    path_follow_lookahead_rad: 0.25
    goal_timeout_s: 60.0
    plan_timeout_s: 10.0
    replan_period_s: 0.3
    path_check_rate_hz: 10.0
    path_clearance: 0.01
    replan_deviation_rad: 0.3
    stall_timeout_s: 2.0
    settle_position_tolerance: 0.005
    idle_guard_distance: 0.05
    idle_guard_release: 0.06

    # Camera map (world_manipulator)
    integrate_depth_rate_hz: 15.0
    update_esdf_rate_hz: 10.0
    map_center: [-0.03, 0.075, 0.43]
    map_size: [1.3, 1.3, 0.8]
    esdf_voxel_size: 0.01
    tsdf_voxel_size: 0.005
    truncation_distance: 0.08
    depth_min: 0.1
    depth_max: 2.0
    decay: 0.7
    floor_z: 0.0
    floor_band: 0.015
    base_exclude: [-0.116, 0.145, 0.0, 0.056, 0.36, 0.135]
    segment_distance: 0.08
    warmup_frames: 15
    # Forget remembered depth behind robot-masked pixels once the ray reaches past it
    memory_margin: 0.03
    depth_scale_16u: 0.001

    # RViz
    ui_rate_hz: 10.0
    goal_marker_scale: 0.2
    marker_period_s: 0.5
