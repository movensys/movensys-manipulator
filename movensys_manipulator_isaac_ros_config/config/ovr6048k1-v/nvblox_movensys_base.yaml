# If you want to check definition, check below link.
# https://nvidia-isaac-ros.github.io/v/release-4.1/repositories_and_packages/isaac_ros_nvblox/isaac_ros_nvblox/api/parameters.html

/**:
  ros__parameters:
    voxel_size: 0.01 # This is critical bottleneck to load nvblox. Please turn off in stage 4.
    use_lidar: false
    use_segmentation: false
    num_cameras: 1
    input_qos: "SENSOR_DATA" # SENSOR_DATA = BEST_EFFORT, SYSTEM_DEFAULT = RELIABLE. Isaac Sim publishes BEST_EFFORT so SENSOR_DATA is required.

    global_frame: "world_manipulator"
    pose_frame: "world_manipulator"

    use_tf_transforms: true

    map_clearing_frame_id: "world_manipulator"
    esdf_slice_bounds_visualization_attachment_frame_id: "world_manipulator"
    esdf_slice_bounds_visualization_side_length: 2.0
    workspace_height_bounds_visualization_attachment_frame_id: "world_manipulator"

    tick_period_ms: 10                  # 1ms = 10Hz, 10ms = 100Hz
    integrate_depth_rate_hz: 40.0       # Desired depth rate. we need to check published depth rate.
    integrate_color_rate_hz: 5.0        # Desired RGB rate. we need to check published RGB rate.
    update_mesh_rate_hz: 0.0       
    publish_layer_rate_hz: 10.0         # ESDF visualized on service request
    update_esdf_rate_hz: 10.0           # ESDF updated on service request
    decay_tsdf_rate_hz: 0.0            # No decay for static scenes
    clear_map_outside_radius_rate_hz: 0.0

    # ESDF settings - 3D mode for manipulation
    esdf_mode: "3d"
    publish_esdf_distance_slice: false

    # Visualization
    layer_visualization_min_tsdf_weight: 0.1
    layer_streamer_bandwidth_limit_mbps: -1.0

    static_mapper:
      projective_integrator_weighting_mode: "constant"
      projective_integrator_max_weight: 5.0
      projective_tsdf_integrator_invalid_depth_decay_factor: 0.8
      esdf_slice_min_height: -0.1    # Below table level
      esdf_slice_max_height: 1.2     # Above workspace
      esdf_slice_height: 0.3         # Height of slice (table surface ~0.3m)
      
      esdf_integrator_min_weight: 0.1
