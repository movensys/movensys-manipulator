controller_manager:
    ros__parameters:
        update_rate: 500
        use_sim_time: True

        joint_state_broadcaster:
            type: joint_state_broadcaster/JointStateBroadcaster

        gazebo_position_controller:
            type: position_controllers/JointGroupPositionController

# Gains start at ~10x the Dobot values for the ~61 kg Synustech arm.
# TODO(synustech): tune in Gazebo.
gazebo_position_controller:
    ros__parameters:
        joints:
            - joint1
            - joint2
            - joint3
            - joint4
            - joint5
            - joint6
        interface_name: position
        command_interfaces:
            - position
        state_interfaces:
            - position
            - velocity
        joint1:
            p: 50000.0
            i: 1000.0
            d: 5000.0
            i_clamp: 1000.0
        joint2:
            p: 100000.0
            i: 2000.0
            d: 10000.0
            i_clamp: 2000.0
        joint3:
            p: 100000.0
            i: 2000.0
            d: 10000.0
            i_clamp: 2000.0
        joint4:
            p: 25000.0
            i: 500.0
            d: 2500.0
            i_clamp: 500.0
        joint5:
            p: 25000.0
            i: 500.0
            d: 2500.0
            i_clamp: 500.0
        joint6:
            p: 10000.0
            i: 250.0
            d: 1000.0
            i_clamp: 250.0