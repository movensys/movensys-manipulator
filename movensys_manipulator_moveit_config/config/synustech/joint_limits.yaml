# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed
# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]

# DUCO GCR30-1100 (hardware manual, basic parameter table):
#   max joint velocity  J1 120, J2 120, J3 180, J4-J6 225 deg/s
# Velocities below are the datasheet values in rad/s. Accelerations are not
# published by the manufacturer; 2.0 rad/s^2 is a conservative placeholder.
# TODO(synustech) - tune accelerations once the arm runs on hardware.

joint_limits:
  joint1:
    has_velocity_limits: true
    max_velocity: 2.094
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint2:
    has_velocity_limits: true
    max_velocity: 2.094
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint3:
    has_velocity_limits: true
    max_velocity: 3.142
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint4:
    has_velocity_limits: true
    max_velocity: 3.927
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint5:
    has_velocity_limits: true
    max_velocity: 3.927
    has_acceleration_limits: true
    max_acceleration: 2.0
  joint6:
    has_velocity_limits: true
    max_velocity: 3.927
    has_acceleration_limits: true
    max_acceleration: 2.0
