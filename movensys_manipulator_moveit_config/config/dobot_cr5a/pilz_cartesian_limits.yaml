# Cartesian limits for the Pilz planner.
# These bound LIN/CIRC Cartesian speed; the actual speed is this * vel_scale.
# Keep conservative for Real mode and raise once motion looks clean.
cartesian_limits:
  max_trans_vel: 0.25    # [m/s]
  max_trans_acc: 0.5     # [m/s^2]
  max_trans_dec: 0.5     # [m/s^2]
  max_rot_vel: 1.5708    # [rad/s]
