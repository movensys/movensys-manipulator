/**:
  ros__parameters:
    base_name:         "world_manipulator"
    eef_name:          "Link6"
    # Planning pipeline / planner selection.
    #   pipeline_id: "" or "ompl" -> OMPL (default free-space planner)
    #                "pilz_industrial_motion_planner" -> Pilz industrial planner
    #   planner_id:  PTP (joint-space point-to-point) | LIN (Cartesian straight line)
    #                | CIRC (circular). Ignored when pipeline_id is empty/OMPL.
    pipeline_id:       "pilz_industrial_motion_planner"
    planner_id:        "PTP"
    vel_scale:         1.0
    acc_scale:         1.0
    delay_exec:        0.1
    delay_gripper:     1.0
    max_step:          0.1
    planning_time:     1.0
    timeout:           1.0
    planning_attempts: 5
    replan:            true
    replan_attempts:   5
