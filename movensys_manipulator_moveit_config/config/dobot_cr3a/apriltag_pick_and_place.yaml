apriltag_pick_and_place:
  ros__parameters:
    # AprilTag pick-and-place config
    camera_hand_link:    "camera_hand_color_optical_frame"
    tag_ids:             ["tag36h11:5", "tag36h11:9", "tag36h11:7", "tag36h11:11"]
    target_topics:       ["/target1_sub", "/target2_sub", "/target3_sub", "/target4_sub"]

    z_target_pose_spawn: 0.07
    tag_down_z:          0.11

    # Pilz blended-LIN pick. When true the target-offset move and the descent
    # to grasp run as one continuous LIN sequence, blending through the hover.
    # The joint-space transit to the drop box is unchanged (place side unaffected).
    use_pilz_blend: true
    blend_pick:   0.02       # [m] < offset segment and < tag_down_z (0.11)
    goal_tol_pos: 0.001      # [m]   LIN goal position tolerance
    goal_tol_ang: 0.01       # [rad] LIN goal orientation tolerance

    tag_tol_pose:        0.03
    tag_tol_orientation: 0.05
    tag_to_target_x:     0.01
    tag_to_target_y:    -0.065
    tag_to_target_yaw:   0.0

    joint_names:  [joint1, joint2, joint3, joint4, joint5, joint6]
    initial_pose: [-0.0003, 0.7041, -1.9892, -0.2873, 1.57, 0.0]
    scan_pose:    [-0.27, 0.0,  0.400, 3.14159265, 0.0, -3.14159265]

    box_up_0:   [0.13,  -0.17, 0.400, 3.141, 0.0, 3.108]
    box_down_0: [0.13,  -0.17, 0.295, 3.141, 0.0, 3.108]

    box_up_1:   [0.23,  -0.17,  0.400, 3.141, 0.0, 3.108]
    box_down_1: [0.23,  -0.17,  0.295, 3.141, 0.0, 3.108]

    box_up_2:   [0.13, -0.07,  0.400, 3.142, 0.0, 3.101]
    box_down_2: [0.13, -0.07,  0.295, 3.142, 0.0, 3.101]

    box_up_3:   [0.23,  -0.07,  0.400, 3.142, 0.0, 3.104]
    box_down_3: [0.23,  -0.07,  0.295, 3.142, 0.0, 3.104]