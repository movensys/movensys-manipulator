name: Test - movensys_manipulator_description

on:
  pull_request:
    branches: [main, devel]
    paths:
      - 'movensys_manipulator_description/**'

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: jazzy
            os: ubuntu-24.04
          - ros_distro: humble
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}
    # The ros-base images ship rosdep, colcon and the ROS apt source, so no
    # setup-ros action is needed (it queries the GitHub API anonymously and
    # fails on rate limits).
    container: ros:${{ matrix.ros_distro }}-ros-base

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        run: |
          mkdir -p ~/movensys_ws/src
          # Use the env var, not the github.workspace expression: inside a
          # container job the expression expands to the *host* path, leaving a
          # dangling symlink that makes rosdep and colcon silently find zero
          # packages. The ls fails the step if the link does not resolve.
          ln -s "$GITHUB_WORKSPACE" ~/movensys_ws/src/movensys-manipulator
          ls ~/movensys_ws/src/movensys-manipulator/*/package.xml

      - name: Install dependencies
        run: |
          apt-get update
          rosdep update --rosdistro ${{ matrix.ros_distro }}
          cd ~/movensys_ws
          rosdep install --from-paths src/movensys-manipulator/movensys_manipulator_description \
            --ignore-src -y --rosdistro ${{ matrix.ros_distro }}

      - name: Build
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/movensys_ws
          colcon build --symlink-install \
            --packages-select movensys_manipulator_description

      - name: Test xacro for each manipulator model
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/movensys_ws
          source install/setup.bash
          for model in dobot_cr3a dobot_cr5a synustech; do
            echo "=== xacro test: $model ==="
            xacro src/movensys-manipulator/movensys_manipulator_description/urdf/$model/movensys_manipulator.xacro \
              > /tmp/$model.urdf
            echo "  OK: $model.urdf generated"
          done

      - name: Test gazebo_trajectory_simulation launch file
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/movensys_ws
          source install/setup.bash
          for model in dobot_cr3a dobot_cr5a synustech; do
            echo "=== launch test: $model ==="
            env MANIPULATOR_MODEL=$model timeout 30s ros2 launch \
              movensys_manipulator_description gazebo_trajectory_simulation.launch.py \
              || [ $? -eq 124 ] && echo "  OK: $model launch exited after 30s"
          done
