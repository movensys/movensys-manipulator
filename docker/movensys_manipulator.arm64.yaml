services:
  movensys_manipulator:
    build:
      args:
        - ARCH=arm64
    environment:
      - XAUTHORITY=/run/user/1000/gdm/Xauthority
    volumes:
      - /run/user/1000/gdm:/run/user/1000/gdm:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    group_add:
      - "0"   # root group — nvidia-container-toolkit ≥1.18 mounts Jetson GPU devices as root:root (not root:video)
