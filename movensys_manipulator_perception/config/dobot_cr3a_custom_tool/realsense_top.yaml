/**:
  ros__parameters:
    device_type: ''
    # TODO: set the top camera's serial number. Empty picks the first
    # RealSense found, which may be the wrong one if several are plugged in.
    serial_no: ''
    usb_port_id: ''

    enable_accel: false
    enable_color: true
    enable_depth: false
    enable_gyro: false
    enable_infra1: false
    enable_infra2: false

    rgb_camera:
      profile: '640x480x15'
    color_qos: "SYSTEM_DEFAULT"

    camera_resolution:
      width: 640
      height: 480
    camera_name: 'camera_top'
    focal_length:
      f_x: 380.0
      f_y: 380.0
